<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

#login-page {
    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background-color: #f7f7f7;
}

#login-card {
    width: 420px;

    background-color: white;

    padding: 40px;

    border-radius: 10px;

    box-shadow: 0 3px 15px rgba(0,0,0,0.15);

    text-align: center;
}


#login-card h1 {
    color: #a000c8;

    font-size: 32px;

    margin-bottom: 35px;
}


#login-card h2 {
    font-size: 22px;

    color: #333;

    margin-bottom: 10px;
}

#login-card > p {
    color: #777;

    font-size: 14px;

    margin-bottom: 25px;
}


/* MOBILE NUMBER */

#mobile-box {
    width: 100%;
    height: 55px;

    display: flex;
    align-items: center;

    border: 1px solid #ccc;

    border-radius: 6px;

    margin-bottom: 20px;
}

#mobile-box span {
    padding: 0 15px;

    color: #555;

    border-right: 1px solid #ccc;
}

#mobile-box input {
    width: 100%;

    height: 100%;

    border: none;

    outline: none;

    padding: 0 15px;

    font-size: 15px;
}


/* CONTINUE BUTTON */

#continue {
    width: 100%;
    height: 55px;

    border: none;

    border-radius: 6px;

    background-color: #a000c8;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

#continue:hover {
    background-color: #8500a8;
}


/* TERMS */

#terms {
    margin-top: 25px;

    font-size: 11px;

    line-height: 18px;

    color: #777;
}

#terms a {
    color: #a000c8;

    text-decoration: none;
}
    </style> 
</head>
<body>
    <div id="login-page">

    <div id="login-card">

        <h1>purple</h1>

        <h2>Login or Signup</h2>

        <p>Enter your mobile number to continue</p>

        <div id="mobile-box">
            <span>+91</span>
            <input 
                type="text" 
                placeholder="Enter mobile number"
                maxlength="10"
            >
        </div>

        <button id="continue">
            CONTINUE
        </button>

        <p id="terms">
            By continuing, you agree to our
            <a href="#">Terms & Conditions</a>
            and
            <a href="#">Privacy Policy</a>
        </p>

    </div>

</div>
</body>
</html>
